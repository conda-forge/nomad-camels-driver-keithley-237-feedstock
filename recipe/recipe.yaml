schema_version: 1

context:
  name: nomad-camels-driver-keithley-237
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_camels_driver_keithley_237-${{ version }}.tar.gz
  sha256: 6b3d1192c180e1325f3c84866118b934c6b43cb2202cc06026ba2ede4adfcd2d

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - pyvisa
    - pyvisa-py

tests:
  - python:
      imports:
        - nomad_camels_driver_keithley_237
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Device driver for the Keithley 237 SMU.
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/FAU-LAP/CAMELS_drivers

extra:
  recipe-maintainers:
    - jan-janssen
